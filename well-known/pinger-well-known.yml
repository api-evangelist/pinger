notes:
- www.pinger.com, textfree.com and www.sideline.com are WordPress marketing sites; /.well-known/security.txt
  returns a bare nginx 404 while the other paths fall through to the WordPress 404 template (HTML, 404
  status) - neither is a document.
- api.pinger.com resolves through Cloudflare, 302s / to www.pinger.com, returns 410 Gone for /v1/, /1.0/,
  /docs, /openapi.json, /swagger.json, /api-docs and 403 for every /.well-known/* path. It is a retired
  or private mobile-app backend, not a published API.
- messages.sideline.com (Sideline web messaging) and app.getindex.com (Index web app) are SPA shells that
  answer 404 with the app HTML for unknown paths.
