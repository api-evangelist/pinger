aid: pinger
name: Pinger
description: 'Pinger, Inc. is a San Jose, California mobile communications company founded
  in 2005 by former Palm managers Greg Woock and Joe Sipher. It builds consumer and small-business
  calling and texting apps rather than developer infrastructure: TextFree (launched 2009, the
  original free texting and calling app with a free US phone number), Sideline (a second phone
  number for work and privacy, with team number sharing, spam filtering, auto-reply and voicemail
  transcription) and Index (a dedicated business line with auto-reply, scheduling, broadcast
  messaging and payment collection). Sideline and TextFree have together been used by more than
  100 million people. Pinger publishes no public developer program, API reference, OpenAPI
  definition or SDK — its integrations run the other way, with Index consuming third-party
  calendar (Google, iCloud, Outlook) and payment (PayPal, Venmo, Square) services. The one
  machine-readable artifact it publishes is an llms.txt information sheet on the Sideline domain.'
